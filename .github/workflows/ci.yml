name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Ruff 检查
        run: ruff check .

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: 导入冒烟测试
        env:
          DEEPSEEK_API_KEY: "sk-test-placeholder"
        run: |
          python -c "from plugins.roleplay import config; print('config OK')"
          python -c "from plugins.roleplay import ai_client; print('ai_client OK')"
