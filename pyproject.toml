[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qq-roleplay-bot"
version = "0.1.0"
description = "AI 角色扮演 QQ 群聊机器人，基于 NoneBot2 + NapCat + DeepSeek"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "qq-roleplay-bot contributors" }
]
keywords = ["qq", "nonebot2", "napcat", "roleplay", "ai", "deepseek", "onebot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
]

# ─── 运行依赖 ───
dependencies = [
  "nonebot2>=2.4.0",
  "nonebot-adapter-onebot>=2.4.0",
  "nonebot-plugin-apscheduler>=0.5.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0",
  "aiosqlite>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/cnc876297794-arch/qq-roleplay-bot"
Issues = "https://github.com/cnc876297794-arch/qq-roleplay-bot/issues"

[tool.nonebot]
plugins = []
plugin_dirs = ["plugins"]
builtin_plugins = ["echo"]

[tool.setuptools.packages.find]
# 仓库是 flat-layout,根目录有 qqbot/config/plugins 三个目录
# 显式告诉 setuptools 只打包这两个 Python 包
# config/ 是 YAML 配置,不入包
include = ["qqbot*", "plugins*"]
exclude = ["config*", "characters*", "data*", "docs*", "napcat*"]


[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    "venv",
    ".venv",
    "build",
    "dist",
    "napcat",
    "napcat_data",
    "characters",
    "data",
]

[tool.ruff.lint]
# E/F/UP/I 是核心,W 是复杂警告
select = ["E", "F", "UP", "I", "W"]
# 争议性 / 改起来风险高 / 项目里没必要严格的规则,直接禁用
ignore = [
    "E501",  # 行太长 (Chinese comments + 复杂 prompt 模板很难控制)
    "E402",  # 模块级 import 不在文件顶部 (允许 lazy import)
    "E741",  # 变量名歧义 (项目里 "l" 是允许的)
    "F401",  # 未使用 import (--fix 修,但允许 noqa 显式标记)
    "F841",  # 未使用变量 (debug 时常见)
]